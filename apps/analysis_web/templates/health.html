{% extends "base.html" %}
{% block title %}Health{% endblock %}
{% block content %}
<div class="card">
  <h1>Catalog health</h1>
  <p class="muted">ARCHIVE_ROOT = <span class="mono">{{ health.archive_root }}</span></p>
  <table>
    {% for k, v in health.items() %}
    <tr><th>{{ k }}</th><td class="mono">{{ v }}</td></tr>
    {% endfor %}
  </table>
</div>
{% endblock %}
