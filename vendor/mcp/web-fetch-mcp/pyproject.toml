[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "web-fetch-mcp"
version = "0.1.0"
description = "MCP server exposing lightweight web-fetch and readable-text extraction"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
]

[project.scripts]
web-fetch-mcp = "web_fetch_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]
